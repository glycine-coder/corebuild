<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>共通テスト問題ビューアー</title>
  <link rel="stylesheet" href="assets/exam-viewer/exam-viewer.css?v=20260901b">
  <link rel="stylesheet" href="assets/exam-viewer/exam-viewer-revisions.css?v=20260904b">
  <link rel="stylesheet" href="assets/exam-platform/exam-shell.css?v=20260909a">
  <link rel="stylesheet" href="assets/exam-platform/rights.css?v=20260912a">
  <link rel="stylesheet" href="assets/exam-platform/answer-sync-consent.css?v=20260904a">
</head>
<body>
  <header class="exam-header">
    <div><p class="eyebrow" id="examMeta">大学入学共通テスト</p><h1 id="examTitle">読み込み中</h1></div>
    <div class="score-badge"><span>配点</span><strong id="maxScore">—</strong><span>点</span></div>
  </header>
  <nav class="section-nav" id="sectionNav" aria-label="大問移動"></nav>
  <main id="examMain" tabindex="-1"></main>
  <footer class="control-bar shared-control-bar">
    <div class="progress"><strong id="answeredCount">0</strong> / <span id="answerTotal">—</span> 解答済み</div>
    <div class="exam-timer" id="examTimer" hidden><span id="timerModeLabel">本番時間</span><strong id="timerText">--:--</strong></div>
    <div class="section-controls"><button id="prevButton" type="button">前へ</button><span id="positionText"></span><button id="nextButton" type="button">次へ</button></div>
    <div class="actions"><button id="resetButton" type="button">回答をリセット</button><button id="skipRandomButton" type="button" hidden>この問題を飛ばす</button><button class="abandon-attempt-button" id="abandonAttemptButton" type="button" hidden>途中で諦める</button><button class="primary" id="scoreButton" type="button" disabled>採点する</button></div>
  </footer>
  <section class="result" id="result" hidden aria-live="polite"></section>
  <div class="timer-start-overlay" id="timerStartOverlay" hidden role="status" aria-live="assertive">
    <div><p>本番時間モード</p><strong id="timerStartCount">3</strong><span>秒後に開始します</span></div>
  </div>
  <footer class="site-rights-footer">
    <p id="examRightsFooterText">本サイトの試験問題・図表・関連素材は、必要な掲載・利用の許諾を確認したものです。</p>
    <nav class="site-policy-links" aria-label="サイト方針">
      <a href="rights.html">掲載許諾・出典・権利に関する方針</a>
      <a href="privacy.html">回答データの取扱方針</a>
    </nav>
  </footer>
  <script src="assets/exam-platform/scoring-engine.js?v=20260829b"></script>
  <script src="assets/exam-platform/answer-collection-config.js?v=20260912a"></script>
  <script src="assets/exam-platform/answer-sync-client.js?v=20260912a"></script>
  <script src="assets/exam-platform/exam-platform.js?v=20260904c"></script>
<script src="assets/exam-viewer/exam-viewer.js?v=20260909a"></script>
</body>
</html>
